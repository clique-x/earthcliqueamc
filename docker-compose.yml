services:
  postgres:
    # Multi-arch build of the official postgis image (postgis/postgis has no arm64 build)
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_USER: amc
      POSTGRES_PASSWORD: amc
      POSTGRES_DB: amc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
volumes:
  pgdata:
